<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Exhaustion Narrator</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: #eee;
      padding: 20px;
    }
    textarea {
      width: 100%;
      height: 200px;
      background: #222;
      color: #eee;
      border: 1px solid #444;
      padding: 10px;
      font-size: 16px;
    }
    button {
      margin-top: 15px;
      padding: 12px 20px;
      background: #444;
      color: #fff;
      border: none;
      font-size: 16px;
    }
    audio {
      margin-top: 20px;
      width: 100%;
    }
  </style>
</head>
<body>
  <h2>Exhaustion Narrator</h2>
  <textarea id="textInput" placeholder="Type your narration here..."></textarea>
  <button onclick="generateVoice()">Generate Voice</button>
  <audio id="audioPlayer" controls></audio>
  <script src="app.js"></script>
</body>
</html>
